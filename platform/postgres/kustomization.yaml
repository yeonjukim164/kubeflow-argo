# MLflow(백엔드 스토어)와 Feast(SQL 레지스트리)가 함께 쓰는 PostgreSQL. DB/사용자: mlflow, feast
# 비밀번호는 Secret "postgres" (bootstrap/create-secrets.sh 가 생성)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlops

resources:
- postgres.yaml

configMapGenerator:
- name: postgres-init
  files:
  - 10-mlops-databases.sh
