# KServe v0.18.0 (kubeflow/manifests 26.03.1 고정 버전) + 모델 웹앱(대시보드의 KServe Endpoints)
# Knative 를 설치하지 않으므로 기본 배포 모드를 Serverless(Knative) 대신 Standard(Deployment + Service + HPA)로 바꿈
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- https://github.com/kubeflow/manifests//applications/kserve/kserve?ref=26.03.1
- https://github.com/kubeflow/manifests//applications/kserve/models-web-app/overlays/kubeflow?ref=26.03.1

patches:
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: inferenceservice-config
      namespace: kubeflow
    data:
      deploy: |-
        {
          "defaultDeploymentMode": "Standard"
        }
# 컨트롤러의 CPU 제한이 100m 이면 호스트가 바쁠 때 80초 안에 뜨지 못해 liveness 에 걸려 재시작을 반복했다(5일에 195번).
# 그동안 웹훅도 응답하지 않아 InferenceService 를 만들거나 고칠 수 없었다.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: kserve-controller-manager
      namespace: kubeflow
    spec:
      template:
        spec:
          containers:
          - name: manager
            resources:
              limits: {cpu: "1", memory: 300Mi}
              requests: {cpu: 100m, memory: 200Mi}
