# SeaweedFS S3 호환 API 를 LAN 에 노출: http://<노드 IP>:30900 (책의 MinIO port-forward 대신)
# 업스트림 NetworkPolicy 는 클러스터 안(Profile 네임스페이스 등)만 허용하므로 S3 포트를 외부에도 허용
# 주의: 키가 kubeflow/manifests 기본값(minio/minio123)이므로 홈랩 내부망 전용
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3-nodeport
  namespace: kubeflow
spec:
  type: NodePort
  selector:
    app: seaweedfs
  ports:
  - name: http-s3
    port: 9000
    targetPort: 8333
    nodePort: 30900
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-allow-external-s3
  namespace: kubeflow
spec:
  podSelector:
    matchLabels:
      app: seaweedfs
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - port: 8333
