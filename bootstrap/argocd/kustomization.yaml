# Argo CD 설치 (최초 1회, 수동): kubectl apply -k bootstrap/argocd --server-side --force-conflicts
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
- namespace.yaml
- https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
- argocd-server-nodeport.yaml

patches:
- path: argocd-cm.yaml
