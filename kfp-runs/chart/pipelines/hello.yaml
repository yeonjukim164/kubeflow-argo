# PIPELINE DEFINITION
# Name: hello
# Inputs:
#    msg: str [Default: 'hello']
components:
  comp-hello:
    executorLabel: exec-hello
    inputDefinitions:
      parameters:
        msg:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-hello:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - hello
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef hello(msg: str) -> str:\n    print(\"[ch09] hello:\", msg, flush=True)\n\
          \    return msg\n\n"
        image: python:3.11-slim
pipelineInfo:
  name: hello
root:
  dag:
    tasks:
      hello:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-hello
        inputs:
          parameters:
            msg:
              componentInputParameter: msg
        taskInfo:
          name: hello
  inputDefinitions:
    parameters:
      msg:
        defaultValue: hello
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
