# 모니터링 스택 (namespace: monitoring). Helm 차트 3개와, 대상별 설정(PodMonitor, 알림 규칙, 대시보드)을 둔 monitoring/ 디렉터리.
# Grafana 관리자 비밀번호 Secret 은 저장소에 두지 않음 → bootstrap/create-monitoring-secrets.sh 로 먼저 생성
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 94.1.0
    helm:
      releaseName: kps
      # CRD 10개는 처음 설치할 때 만들어졌음. 하나가 수백 KB 라서 Argo CD 가 상태를 확인하다 시간 초과가 났고,
      # 같은 동기화를 계속 다시 시도했음. 그래서 CRD 는 Argo CD 가 관리하지 않게 뺐음(차트를 올릴 때는 CRD 를 따로 적용함).
      skipCrds: true
      valuesObject:
        # 홈랩은 호스트 CPU 가 빠듯해서 기본 구성을 줄였음: 기본 알림 규칙과 기본 대시보드를 끄고,
        # kube-apiserver 와 CoreDNS 는 수집하지 않고, 수집 주기를 60초로 늘림.
        defaultRules:
          create: false
        kubeApiServer:
          enabled: false
        coreDns:
          enabled: false
        kubelet:
          serviceMonitor:
            interval: 60s
            probes: false
            resource: false
        # kubeadm 은 이 넷을 127.0.0.1 에만 열어 두어서 수집할 수 없음. 켜 두면 Down 알림만 계속 뜸.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        prometheus:
          service:
            type: NodePort
            nodePort: 30090
          prometheusSpec:
            # release 라벨이 없는 PodMonitor, ServiceMonitor, PrometheusRule 도 모든 네임스페이스에서 읽음
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 3d
            scrapeInterval: 60s
            evaluationInterval: 30s
            resources:
              requests:
                cpu: 200m
                memory: 768Mi
              limits:
                memory: 2Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                  - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi
        alertmanager:
          service:
            type: NodePort
            nodePort: 30093
          alertmanagerSpec:
            # AlertmanagerConfig 의 라우팅을 그 리소스가 있는 네임스페이스의 알림으로 좁히지 않음
            alertmanagerConfigMatcherStrategy:
              type: None
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 256Mi
        grafana:
          service:
            type: NodePort
            nodePort: 30300
          defaultDashboardsEnabled: false
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # 홈랩에서는 Grafana 가 뜨는 데 3분 넘게 걸려서, 기본 liveness(60초 뒤부터 확인)에 걸려 계속 재시작했음.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 1500
            timeoutSeconds: 30
            failureThreshold: 10
          env:
            GF_PLUGINS_PREINSTALL_DISABLED: "true"   # 시작할 때 플러그인을 내려받아 설치하지 않음
            GOMAXPROCS: "2"                          # Go 런타임이 CPU 제한에 맞는 수의 스레드만 쓰게 함
          # CPU 제한이 없으면 Grafana 13 이 노드의 vCPU 28개를 다 쓰려고 해서(측정값 6~13코어) 다른 파드가 밀렸음.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 768Mi
          additionalDataSources:
          - name: Loki
            type: loki
            uid: loki
            access: proxy
            url: http://loki.monitoring.svc.cluster.local:3100
          sidecar:
            dashboards:
              searchNamespace: monitoring
        prometheusOperator:
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.7.0
    helm:
      releaseName: loki
      valuesObject:
        # 파드 하나에 모든 역할을 넣고 로그를 노드의 디스크(PVC)에 둠. 홈랩 규모에 맞춘 가장 작은 구성.
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
            - from: "2026-11-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
          limits_config:
            retention_period: 72h
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
        singleBinary:
          replicas: 1
          persistence:
            size: 5Gi
            storageClass: local-path
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
        write:
          replicas: 0
        read:
          replicas: 0
        backend:
          replicas: 0
        gateway:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
        minio:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.16.0
    helm:
      releaseName: alloy
      valuesObject:
        # Loki 는 로그를 저장하고 조회만 함. 노드마다 Alloy 를 띄워 /var/log/pods 의 파일을 읽어 Loki 로 보냄.
        controller:
          type: daemonset
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        alloy:
          mounts:
            varlog: true
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 500m   # 로그 수집이 노드의 CPU 를 다 쓰지 못하게 막음
              memory: 256Mi
          configMap:
            content: |
              // 이 노드에 있는 파드만 찾음
              discovery.kubernetes "pods" {
                role = "pod"
                // 로그를 조회할 네임스페이스만 읽음. 전체(파드 250여 개)를 읽을 때는 노드마다 CPU 제한 500m 를 다 썼음.
                namespaces {
                  names = ["kubeflow-user-example-com", "monitoring", "mlops"]
                }
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
                }
              }
              // 파드의 메타데이터를 로그 라벨로 바꾸고, 읽을 로그 파일의 경로를 만듦
              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
              }
              local.file_match "pods" {
                path_targets = discovery.relabel.pods.output
              }
              // tail_from_end: 설치하기 전에 쌓인 로그는 읽지 않고 새로 쌓이는 줄만 보냄.
              // 처음부터 읽게 두었더니 25일 치 로그를 한꺼번에 처리하느라 노드마다 CPU 를 13~15코어 썼음.
              loki.source.file "pods" {
                targets       = local.file_match.pods.targets
                forward_to    = [loki.process.cri.receiver]
                tail_from_end = true
              }
              // containerd 가 줄 앞에 붙인 시각과 스트림 이름을 떼어 냄
              loki.process "cri" {
                stage.cri {}
                forward_to = [loki.write.loki.receiver]
              }
              loki.write "loki" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
# 모니터링 대상별 설정(monitoring/ 디렉터리): PodMonitor, 알림 규칙, 알림 라우팅, 대시보드
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: monitoring
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: default
  source:
    repoURL: https://github.com/yeonjukim164/kubeflow-argo.git
    targetRevision: main
    path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
